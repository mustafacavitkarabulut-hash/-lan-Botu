name: ilan-botu

on:
  schedule:
    - cron: "17 * * * *"   # yedek: GitHub gecikse de en az saatlik tetikleme denemesi
  workflow_dispatch:       # elle çalıştırmak için
    inputs:
      loop_minutes:
        description: "Bu çalışma kaç dakika boyunca 15 dakikada bir kontrol etsin"
        default: "320"

permissions:
  contents: write
  actions: write           # bir sonraki çalışmayı kendisi başlatabilsin diye

# Aynı anda tek çalışma; yenisi sıraya girer, eskisini iptal etmez.
concurrency:
  group: ilan-botu
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          pip install playwright requests
          playwright install chromium

      - name: İlanları döngüyle kontrol et
        id: dongu
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '320' }}
        run: |
          git config user.name "ilan-botu"
          git config user.email "ilan-botu@users.noreply.github.com"
          end=$((SECONDS + LOOP_MINUTES * 60))
          last_ok=1
          while true; do
            if python bot.py; then last_ok=1; else last_ok=0; echo "Bu kontrol hata verdi, döngü devam ediyor"; fi
            # Her kontrolden sonra durumu kaydet (yarıda kesilirse aynı ilan iki kez gelmesin)
            git add seen.json
            git diff --cached --quiet || (git commit -m "ilan durumu güncellendi" && git push) || echo "Kayıt gönderilemedi, bir sonraki turda tekrar denenecek"
            if [ "$SECONDS" -ge "$end" ]; then break; fi
            sleep 900
          done
          # Son kontrol başarısızsa çalışma kırmızı görünsün
          [ "$last_ok" -eq 1 ]

      - name: Hata ayıklama dosyaları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore

      - name: Bir sonraki çalışmayı başlat
        if: ${{ !cancelled() && steps.dongu.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yml --ref "${{ github.ref_name }}"
