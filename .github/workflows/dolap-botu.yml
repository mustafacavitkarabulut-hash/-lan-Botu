name: dolap-botu

on:
  schedule:
    - cron: "*/20 * * * *"   # her 20 dakikada bir
  workflow_dispatch:          # elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: dolap-botu
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Dolap'ı kontrol et
        run: python dolap.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOLAP_URL: "https://dolap.com/ara?q=telefon&sira=yeni"   # kendi filtreli arama linkinle değiştir
          MAX_PRICE: "1000"
          MIN_PRICE: "0"

      - name: Hata ayıklama dosyaları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dolap-debug
          path: debug/
          if-no-files-found: ignore

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "ilan-botu"
          git config user.email "ilan-botu@users.noreply.github.com"
          git add dolap_seen.json
          git diff --cached --quiet || (git commit -m "dolap durumu güncellendi" && git pull --rebase && git push)
